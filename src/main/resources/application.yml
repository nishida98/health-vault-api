spring:
  application:
    name: health-vault-api
  datasource:
    url: jdbc:postgresql://localhost:5432/health-vault-db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: health-vault-api

health-vault:
  jwt:
    secret: health-vault-local-development-secret-key-32
    expiration-minutes: 60
  storage:
    public-base-url: http://localhost:9000/health-vault
    signing-secret: health-vault-local-storage-secret
    upload-expiration: 15m
    download-expiration: 5m
